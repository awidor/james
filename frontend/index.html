<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>James · #deep-thought-support</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/mona-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/martian-mono-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("james-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-sheet="closed">
  <header class="topbar">
    <div class="brand">
      <span class="james james-lg" id="brand-james" data-mood="idle" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect class="james-head" x="2" y="5" width="28" height="22" rx="9"/><rect class="james-eye" x="10.5" y="12" width="3.6" height="8" rx="1.8"/><rect class="james-eye" x="17.9" y="12" width="3.6" height="8" rx="1.8"/></svg>
      </span>
      <h1 class="wordmark">James</h1>
      <span class="channel-chip" id="channel-chip">#deep-thought-support</span>
      <span class="company" id="company"></span>
    </div>

    <div class="topbar-actions">
      <span class="model" id="model" hidden>
        <span class="model-dot" aria-hidden="true"></span>
        <span class="model-kind" id="model-kind"></span>
        <span class="model-id" id="model-id"></span>
      </span>
      <span class="pop-anchor">
        <button class="btn" id="btn-replay" type="button" aria-haspopup="dialog" aria-label="Re-run all messages">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.2 2.6v2.9h-2.9"/></svg>
          <span class="btn-label" id="btn-replay-label">Re-run all</span>
        </button>
      </span>
      <span class="pop-anchor">
        <button class="btn btn-quiet" id="btn-reset" type="button" aria-haspopup="dialog" aria-label="Reset">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M2.8 2.6v2.9h2.9"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </span>
      <button class="btn btn-icon btn-quiet only-narrow" id="btn-sheet" type="button" aria-label="Open details">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M9.5 3v10"/></svg>
      </button>
      <button class="btn btn-icon btn-quiet" id="btn-theme" type="button" aria-label="Switch theme">
        <svg class="i theme-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.7"/><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1"/></svg>
        <svg class="i theme-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 1 1 6.4 2.8a4.6 4.6 0 0 0 6.8 6.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="channel" aria-label="Channel">
      <div class="legend" id="legend" role="group" aria-label="Highlight messages by action"></div>

      <div class="feed" id="feed">
        <ol class="rail" id="rail" aria-label="Messages and James's decisions"></ol>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-who">
          <div class="persona" id="persona" role="group" aria-label="Sender type">
            <span class="persona-thumb" aria-hidden="true"></span>
            <button type="button" data-persona="internal" aria-pressed="true">Employee</button>
            <button type="button" data-persona="external" aria-pressed="false">External</button>
            <button type="button" data-persona="system" aria-pressed="false">System</button>
          </div>
          <label class="field field-from">
            <span class="field-label label">From</span>
            <input id="in-from" type="text" value="Alex Weber" spellcheck="false">
          </label>
          <label class="field field-role">
            <span class="field-label label">Role</span>
            <input id="in-role" type="text" value="Finance" spellcheck="false">
          </label>
          <label class="field field-time">
            <span class="field-label label">Time</span>
            <input id="in-time" type="text" value="Mon 10:30" spellcheck="false" aria-describedby="time-hint">
            <span class="time-hint" id="time-hint"></span>
          </label>
        </div>
        <div class="composer-write">
          <textarea id="in-text" rows="1" placeholder="Write a message to the channel…" aria-label="Message" required></textarea>
          <span class="composer-key" aria-hidden="true">Enter to send</span>
          <button class="send" id="btn-send" type="submit" aria-label="Send message">
            <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.8V3.4"/><path d="M3.8 7.4 8 3.2l4.2 4.2"/></svg>
          </button>
        </div>
      </form>
    </section>

    <div class="scrim" id="scrim"></div>

    <aside class="panel" id="panel" aria-label="Details">
      <div class="panel-head">
        <div class="tabs" id="tabs" role="tablist" style="--tab: 0">
          <span class="tabs-thumb" aria-hidden="true"></span>
          <button type="button" role="tab" id="tab-decision" data-tab="decision" aria-selected="true" aria-controls="panel-body">Decision</button>
          <button type="button" role="tab" id="tab-tickets" data-tab="tickets" aria-selected="false" aria-controls="panel-body">Tickets <span class="tab-count" id="count-tickets"></span></button>
          <button type="button" role="tab" id="tab-rules" data-tab="rules" aria-selected="false" aria-controls="panel-body">Rules <span class="tab-count" id="count-rules"></span></button>
        </div>
        <button class="btn btn-icon btn-quiet only-narrow" id="btn-sheet-close" type="button" aria-label="Close details">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="panel-body" id="panel-body" role="tabpanel" tabindex="-1"></div>
    </aside>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
